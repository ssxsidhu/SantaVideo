# Postgres + Redis for MyVideoFromSanta on the shared VPS (ssh alias: reality-check).
# Lives in /home/botuser/santavideo next to a .env holding POSTGRES_PASSWORD and REDIS_PASSWORD.
# Ports are bound to 127.0.0.1 only: reach them from a dev PC through an SSH tunnel (see CLAUDE.md).
# The box is shared with other live apps, so every container is memory-capped.
name: santavideo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: santa
      POSTGRES_DB: santa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santa -d santa"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs noeviction; AOF keeps queued render jobs across restarts.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  pgdata:
  redisdata:
